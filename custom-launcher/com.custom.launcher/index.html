<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- soft light in the colour of the focused app; everything else stays true black -->
  <div id="ambient" aria-hidden="true"><div class="amb"></div><div class="amb"></div></div>

  <div id="shift"><!-- moved by a few pixels periodically (OLED care) -->
    <div id="page">
      <header id="hero">
        <div id="hero-left">
          <div id="clock"><span id="hh">--</span><span id="colon">:</span><span id="mm">--</span></div>
          <div id="date">--</div>
        </div>

        <div id="hero-center">
          <div id="weather" class="glass-pill" role="button" tabindex="0" aria-label="WetterOnline öffnen">
            <span id="w-icon">⛅</span>
            <div id="w-details">
              <div id="w-main"><span id="w-temp">--°C</span> <span id="w-city">Musterstadt</span></div>
              <div id="w-sub">Lade Wetter...</div>
            </div>
          </div>

          <div id="gemini-badge" class="glass-pill gemini-pill" role="button" tabindex="0" aria-label="Gemini KI-Assistent öffnen">
            <span class="gemini-icon">✨</span>
            <div class="gemini-details">
              <div class="gemini-title">Gemini KI</div>
              <div class="gemini-sub">Fragen & Steuern</div>
            </div>
          </div>
        </div>

        <div id="hero-right">
          <div id="audio-badge" class="glass-pill audio-pill denon-avr" role="button" tabindex="0" aria-label="Audioausgabe Einstellungen">
            <div class="audio-icon" id="audio-icon">🔊</div>
            <div class="audio-details">
              <div class="audio-title" id="audio-title">Denon AVR-1803</div>
              <div class="audio-sub" id="audio-sub">Optischer Digitalausgang</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Section: Smart Home & Denon Audio Mode -->
      <div class="section-header">
        <div class="section-title-wrap">
          <span class="section-title">Smart Home & Audio</span>
          <span class="section-sub">SmartThings & Denon AVR</span>
        </div>
        <span class="section-hint">OK lang drücken zum Anpassen</span>
      </div>
      <section id="smarthome" class="cards" aria-label="Smart Home"></section>

      <!-- Section: Top Apps & Inputs -->
      <div class="section-header">
        <div class="section-title-wrap">
          <span class="section-title">Favoriten & Eingänge</span>
          <span class="section-sub">Nach Nutzung sortiert</span>
        </div>
      </div>
      <section id="dock" class="cards" aria-label="Favoriten"></section>

      <!-- Section: All Apps -->
      <div class="section-header">
        <div class="section-title-wrap">
          <span class="section-title">Alle Apps</span>
        </div>
      </div>
      <section id="grid" class="cards" aria-label="Apps"></section>
    </div>
  </div>

  <div id="scrim" aria-hidden="true"></div>
  <div id="menu" role="dialog" aria-modal="true" hidden>
    <div id="menu-head"><div id="menu-icon"></div><div id="menu-title"></div></div>
    <div id="menu-clip"><div id="menu-list" role="menu"></div></div>
    <div id="menu-hint"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="dim" aria-hidden="true"></div>

  <!-- Gemini assistant (remote only: tiles + follow-up suggestions, no typing) -->
  <div id="gemini-modal" class="gm" style="display: none;" role="dialog" aria-modal="true" aria-label="Gemini">
    <div class="gm-backdrop" id="gemini-backdrop"></div>
    <div class="gm-shell">
      <header class="gm-top">
        <div class="gm-brand"><span class="gm-spark">✦</span><span class="gm-name">Gemini</span></div>
        <div class="gm-top-right">
          <span class="gm-keyhint">🎙 Mikro-Taste oder Zurück schließt</span>
          <button id="gemini-close-btn" class="gm-close" tabindex="-1" aria-label="Schließen">✕</button>
        </div>
      </header>
      <main id="gemini-chat" class="gm-chat" aria-live="polite"></main>
      <footer id="gemini-chips" class="gm-chips"></footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
