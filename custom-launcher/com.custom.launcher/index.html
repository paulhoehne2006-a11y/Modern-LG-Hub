<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="shift"><!-- moved by a few pixels periodically (OLED care) -->
    <div id="page"><!-- fades/zooms when an app starts -->

      <!-- rows (Zuletzt & Favoriten, Smart Home, categories); built by app.js, slide up under the billboard -->
      <!-- the colour light continuing below the billboard, behind the rows (static, painted once per change) -->
      <div id="glow-low"></div>
      <div id="rows"><div id="scroller"></div></div>

      <!-- fixed top: clock, pills and the billboard describing the focused card -->
      <div id="fixed">
        <div id="glow-top"></div><!-- colour light behind the billboard logo -->
        <header id="topbar" class="reveal" style="--d: 0ms">
          <div id="clockbox">
            <div id="clock"><span id="hh">--</span><span id="colon">:</span><span id="mm">--</span></div>
            <div id="date">--</div>
          </div>
          <div id="pills">
            <div id="weather" class="pill" role="button" aria-label="Wetter">
              <span class="pill-icon" id="w-icon"></span>
              <span class="pill-text"><span class="pill-title" id="w-temp">--°</span><span class="pill-sub" id="w-sub">Musterstadt</span></span>
            </div>
            <div id="gemini-badge" class="pill gemini" role="button" aria-label="Gemini KI-Assistent">
              <span class="pill-icon" id="g-icon"></span>
              <span class="pill-text"><span class="pill-title">Gemini</span><span class="pill-sub">Fragen &amp; Steuern</span></span>
            </div>
            <div id="audio-badge" class="pill audio" role="button" aria-label="Audioausgabe">
              <span class="pill-icon" id="audio-icon"></span>
              <span class="pill-text"><span class="pill-title" id="audio-title">Audio</span><span class="pill-sub" id="audio-sub">Ausgabe</span></span>
            </div>
          </div>
        </header>
        <section id="billboard" class="reveal" style="--d: 60ms" aria-live="polite">
          <div id="bb-content">
            <div id="bb-text">
              <div id="bb-kicker"></div>
              <div id="bb-title"></div>
              <div id="bb-desc"></div>
              <div id="bb-keys"></div>
            </div>
            <div id="bb-logo"><img alt="" draggable="false"><span class="bb-icon"></span></div>
          </div>
        </section>
      </div>
      <div id="fixed-fade" aria-hidden="true"></div>
    </div>
  </div>

  <div id="scrim" aria-hidden="true"></div>
  <div id="menu" role="dialog" aria-modal="true" hidden>
    <div id="menu-head"><div id="menu-icon"></div><div id="menu-titles"><div id="menu-title"></div><div id="menu-sub"></div></div></div>
    <div id="menu-clip"><div id="menu-list" role="menu"></div></div>
    <div id="menu-hint"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="dim" aria-hidden="true"></div>

  <!-- Gemini assistant (remote only: tiles + follow-up suggestions, no typing) -->
  <div id="gemini-modal" class="gm" style="display: none;" role="dialog" aria-modal="true" aria-label="Gemini">
    <div class="gm-backdrop" id="gemini-backdrop"></div>
    <div class="gm-shell">
      <header class="gm-top">
        <div class="gm-brand"><span class="gm-spark">✦</span><span class="gm-name">Gemini</span></div>
        <div class="gm-top-right">
          <span class="gm-keyhint">🎙 Mikro-Taste oder Zurück schließt</span>
          <button id="gemini-close-btn" class="gm-close" tabindex="-1" aria-label="Schließen">✕</button>
        </div>
      </header>
      <main id="gemini-chat" class="gm-chat" aria-live="polite"></main>
      <footer id="gemini-chips" class="gm-chips"></footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
